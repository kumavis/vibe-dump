<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Snake Swamp</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #04060a; overflow: hidden; }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }

      /* "Tap to wake the swamp" overlay — Web Audio needs a user gesture. */
      #veil {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: radial-gradient(120% 90% at 50% 40%, rgba(8, 18, 14, 0.18), rgba(2, 4, 6, 0.6));
        color: #9fb8a6;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        text-align: center;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: opacity 1.1s ease;
        z-index: 10;
      }
      #veil h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 3.2rem);
        font-weight: 600;
        color: #c8dcc8;
        text-shadow: 0 0 24px rgba(40, 90, 60, 0.6);
      }
      #veil p { margin: 0; font-size: 0.95rem; opacity: 0.75; }
      #veil .pulse {
        margin-top: 0.4rem;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.32em;
        opacity: 0.6;
        animation: breathe 2.6s ease-in-out infinite;
      }
      @keyframes breathe { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } }
      #veil.gone { opacity: 0; pointer-events: none; }

      #hint {
        position: fixed;
        left: 50%;
        bottom: 1rem;
        transform: translateX(-50%);
        font-family: "Iowan Old Style", Georgia, serif;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        color: rgba(150, 180, 160, 0.5);
        pointer-events: none;
        z-index: 5;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hint">click the water · the snake drinks the swamp dry</div>
    <div id="veil">
      <h1>Black Snake Swamp</h1>
      <p>a dark forest, a thirsty serpent, frogs that have learned to be afraid</p>
      <span class="pulse">tap to wake the swamp</span>
    </div>

    <script type="module">
      'use strict'

      // ----------------------------------------------------------------------
      // Black Snake Swamp — a self-contained nocturnal vignette.
      //
      // A black snake slithers across swamp water. Wherever its body crosses the
      // surface it evaporates the water into rising threads of steam. Frogs
      // perched on lily pads watch; the nearer the snake, the harder they
      // tremble and the more frantically they croak. Everything — visuals and
      // the spooky swamp ambience — is generated procedurally with Canvas 2D and
      // the Web Audio API. No assets, no network.
      // ----------------------------------------------------------------------

      const canvas = document.getElementById('scene')
      const ctx = canvas.getContext('2d')

      const TAU = Math.PI * 2
      const rand = (a, b) => a + Math.random() * (b - a)
      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v)
      const lerp = (a, b, t) => a + (b - a) * t

      // World dimensions in CSS pixels; updated on resize.
      let W = 0, H = 0, DPR = 1
      let waterY = 0 // y of the waterline

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2)
        W = window.innerWidth
        H = window.innerHeight
        canvas.width = Math.floor(W * DPR)
        canvas.height = Math.floor(H * DPR)
        canvas.style.width = W + 'px'
        canvas.style.height = H + 'px'
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
        waterY = H * 0.46
        rebuildScenery()
      }

      // ----------------------------------------------------------------------
      // Scenery: layered tree silhouettes + lily pads. Rebuilt on resize so the
      // composition always fills the viewport.
      // ----------------------------------------------------------------------
      let treeLayers = []
      let pads = []
      let reeds = []

      function buildBranch(x, y, ang, len, depth, pts) {
        if (depth <= 0 || len < 6) return
        const x2 = x + Math.cos(ang) * len
        const y2 = y + Math.sin(ang) * len
        pts.push([x, y, x2, y2, depth])
        const spread = rand(0.3, 0.7)
        if (Math.random() < 0.92)
          buildBranch(x2, y2, ang - spread, len * rand(0.62, 0.78), depth - 1, pts)
        if (Math.random() < 0.92)
          buildBranch(x2, y2, ang + spread, len * rand(0.62, 0.78), depth - 1, pts)
        if (Math.random() < 0.35)
          buildBranch(x2, y2, ang + rand(-0.2, 0.2), len * 0.7, depth - 1, pts)
      }

      function makeTree(x, baseY, scale) {
        const pts = []
        const trunk = rand(70, 110) * scale
        buildBranch(x, baseY, -Math.PI / 2 + rand(-0.12, 0.12), trunk, 6, pts)
        return { pts, x }
      }

      function rebuildScenery() {
        // Three parallax layers of bare, gnarled trees fading into fog.
        treeLayers = []
        const layerDefs = [
          { n: Math.ceil(W / 240) + 2, scale: 1.15, baseY: waterY + 6, shade: '#070d0a', alpha: 1 },
          { n: Math.ceil(W / 300) + 2, scale: 0.8, baseY: waterY - 4, shade: '#0a1310', alpha: 0.8 },
          { n: Math.ceil(W / 380) + 2, scale: 0.55, baseY: waterY - 14, shade: '#0d1815', alpha: 0.55 },
        ]
        for (const def of layerDefs) {
          const trees = []
          for (let i = 0; i < def.n; i++) {
            const x = (i / (def.n - 1)) * W + rand(-60, 60)
            trees.push(makeTree(x, def.baseY, def.scale * rand(0.85, 1.15)))
          }
          treeLayers.push({ ...def, trees })
        }

        // Lily pads scattered across the water — anchors for the frogs.
        pads = []
        const padCount = Math.max(5, Math.round(W / 220))
        for (let i = 0; i < padCount; i++) {
          pads.push({
            x: rand(W * 0.06, W * 0.94),
            y: rand(waterY + 30, H - 40),
            r: rand(18, 34),
            tilt: rand(-0.3, 0.3),
          })
        }
        pads.sort((a, b) => a.y - b.y)

        // Cattail reeds along the bank.
        reeds = []
        const reedCount = Math.round(W / 70)
        for (let i = 0; i < reedCount; i++) {
          const x = rand(0, W)
          reeds.push({
            x,
            baseY: waterY + rand(-2, 18),
            h: rand(50, 120),
            sway: rand(0, TAU),
            head: Math.random() < 0.55,
          })
        }
      }

      // ----------------------------------------------------------------------
      // The snake — a chain of points tracing a wandering path across the water.
      // ----------------------------------------------------------------------
      const snake = {
        x: -120,
        y: 0,
        head: 0, // heading angle
        speed: 118, // px / sec
        len: 64, // body segments
        seg: 9, // spacing
        path: [], // recent head positions
        phase: 0,
        wanderT: 0,
      }

      function resetSnake(startX = -120) {
        snake.x = startX
        snake.y = waterY + (H - waterY) * 0.5
        snake.head = 0
        snake.path = []
        for (let i = 0; i < snake.len * 4; i++) snake.path.push({ x: snake.x - i * 4, y: snake.y })
      }

      function updateSnake(dt) {
        snake.phase += dt * 6
        snake.wanderT -= dt
        if (snake.wanderT <= 0) {
          snake.wanderT = rand(1.4, 3.2)
          snake.targetY = rand(waterY + 40, H - 50)
        }
        // Steer gently toward a target depth, plus a slithering wiggle.
        const desired = Math.atan2((snake.targetY ?? snake.y) - snake.y, 120)
        const wiggle = Math.sin(snake.phase) * 0.5
        snake.head = lerp(snake.head, desired, 0.04) + wiggle * dt * 4
        const vx = Math.cos(snake.head) * snake.speed
        const vy = Math.sin(snake.head) * snake.speed * 0.6
        snake.x += vx * dt
        snake.y = clamp(snake.y + vy * dt, waterY + 24, H - 30)

        // Record path; cap its length.
        snake.path.unshift({ x: snake.x, y: snake.y })
        const maxPts = snake.len * snake.seg + 8
        if (snake.path.length > maxPts) snake.path.length = maxPts

        // Wrap around once the whole body has left the right edge.
        if (snake.x > W + snake.len * snake.seg) {
          resetSnake()
          snake.x = -snake.len * snake.seg
        }

        // Emit steam where the body crosses the water (which is everywhere it
        // is, since it travels on the surface). Sample a few body points.
        for (let i = 4; i < snake.path.length; i += 7) {
          if (Math.random() < dt * 14) {
            const p = snake.path[i]
            spawnSteam(p.x + rand(-4, 4), p.y + rand(-3, 3))
          }
        }
        if (Math.random() < dt * 10) hiss() // soft evaporation sizzle
      }

      // Sample a smoothed point a given distance back along the body.
      function bodyPoint(seg) {
        const idx = clamp(Math.floor(seg * snake.seg), 0, snake.path.length - 1)
        return snake.path[idx]
      }

      function drawSnake() {
        if (snake.path.length < 4) return
        ctx.save()
        ctx.lineCap = 'round'
        ctx.lineJoin = 'round'

        // Outline glow (faint reflection on the wet skin).
        for (let pass = 0; pass < 2; pass++) {
          ctx.beginPath()
          for (let s = 0; s < snake.len; s++) {
            const p = bodyPoint(s)
            if (!p) break
            if (s === 0) ctx.moveTo(p.x, p.y)
            else ctx.lineTo(p.x, p.y)
          }
          const taper = pass === 0 ? 1 : 0.5
          ctx.lineWidth = 15 * taper
          ctx.strokeStyle = pass === 0 ? '#000000' : 'rgba(60, 90, 70, 0.25)'
          // Width taper by drawing decreasing segments would be heavy; this
          // double pass gives a body + a sheen highlight cheaply.
          ctx.stroke()
        }

        // Tapered body: redraw segment by segment with shrinking width so the
        // tail comes to a point.
        for (let s = 0; s < snake.len - 1; s++) {
          const p = bodyPoint(s)
          const q = bodyPoint(s + 1)
          if (!p || !q) break
          const t = s / snake.len
          const w = 16 * (1 - t) * (1 - t) + 2
          ctx.beginPath()
          ctx.moveTo(p.x, p.y)
          ctx.lineTo(q.x, q.y)
          ctx.lineWidth = w
          // Subtle scale shimmer along the body.
          const shimmer = 0.5 + 0.5 * Math.sin(snake.phase * 1.5 - s * 0.5)
          const g = Math.floor(18 + shimmer * 22 * (1 - t))
          ctx.strokeStyle = `rgb(${g * 0.3 | 0}, ${g}, ${g * 0.6 | 0})`
          ctx.stroke()
        }

        // Head.
        const h = snake.path[0]
        const h2 = snake.path[Math.min(6, snake.path.length - 1)]
        const ang = Math.atan2(h.y - h2.y, h.x - h2.x)
        ctx.save()
        ctx.translate(h.x, h.y)
        ctx.rotate(ang)
        ctx.fillStyle = '#050807'
        ctx.beginPath()
        ctx.ellipse(2, 0, 14, 9, 0, 0, TAU)
        ctx.fill()
        // Eyes — cold green glints.
        ctx.fillStyle = 'rgba(150, 255, 170, 0.92)'
        ctx.beginPath(); ctx.arc(6, -4, 1.7, 0, TAU); ctx.fill()
        ctx.beginPath(); ctx.arc(6, 4, 1.7, 0, TAU); ctx.fill()
        // Flicking tongue.
        const flick = Math.sin(snake.phase * 2.2)
        if (flick > 0.3) {
          ctx.strokeStyle = 'rgba(220, 60, 80, 0.85)'
          ctx.lineWidth = 1.4
          const tl = 10 + flick * 8
          ctx.beginPath()
          ctx.moveTo(14, 0)
          ctx.lineTo(14 + tl, -2.5)
          ctx.moveTo(14, 0)
          ctx.lineTo(14 + tl, 2.5)
          ctx.stroke()
        }
        ctx.restore()
        ctx.restore()
      }

      // ----------------------------------------------------------------------
      // Steam particles — the "evaporated water".
      // ----------------------------------------------------------------------
      const steam = []
      function spawnSteam(x, y) {
        if (steam.length > 360) return
        steam.push({
          x, y,
          vx: rand(-6, 6),
          vy: rand(-26, -42),
          life: 0,
          ttl: rand(1.6, 3.0),
          r0: rand(3, 7),
          rg: rand(16, 30),
        })
      }
      function updateSteam(dt) {
        for (let i = steam.length - 1; i >= 0; i--) {
          const s = steam[i]
          s.life += dt
          if (s.life >= s.ttl) { steam.splice(i, 1); continue }
          s.x += (s.vx + Math.sin(s.life * 2 + s.x * 0.05) * 8) * dt
          s.y += s.vy * dt
          s.vy *= 1 - dt * 0.3 // slows as it rises
        }
      }
      function drawSteam() {
        ctx.save()
        ctx.globalCompositeOperation = 'lighter'
        for (const s of steam) {
          const t = s.life / s.ttl
          const r = lerp(s.r0, s.rg, t)
          const a = Math.sin(t * Math.PI) * 0.16
          const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r)
          grd.addColorStop(0, `rgba(180, 220, 200, ${a})`)
          grd.addColorStop(1, 'rgba(120, 160, 150, 0)')
          ctx.fillStyle = grd
          ctx.beginPath()
          ctx.arc(s.x, s.y, r, 0, TAU)
          ctx.fill()
        }
        ctx.restore()
      }

      // ----------------------------------------------------------------------
      // Ripples (snake wake + user clicks).
      // ----------------------------------------------------------------------
      const ripples = []
      function spawnRipple(x, y, strength = 1) {
        ripples.push({ x, y, r: 2, max: rand(40, 90) * strength, life: 0, ttl: rand(1.4, 2.4) })
      }
      function updateRipples(dt) {
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i]
          r.life += dt
          r.r = lerp(2, r.max, r.life / r.ttl)
          if (r.life >= r.ttl) ripples.splice(i, 1)
        }
      }
      function drawRipples() {
        ctx.save()
        for (const r of ripples) {
          const a = (1 - r.life / r.ttl) * 0.28
          ctx.strokeStyle = `rgba(140, 180, 165, ${a})`
          ctx.lineWidth = 1.4
          ctx.beginPath()
          ctx.ellipse(r.x, r.y, r.r, r.r * 0.34, 0, 0, TAU)
          ctx.stroke()
        }
        ctx.restore()
      }

      // ----------------------------------------------------------------------
      // Frogs — perched on lily pads, croaking, trembling when the snake nears.
      // ----------------------------------------------------------------------
      const frogs = []
      function buildFrogs() {
        frogs.length = 0
        const usable = pads.filter((p) => p.y > waterY + 24)
        const n = Math.min(usable.length, Math.max(3, Math.round(W / 320)))
        for (let i = 0; i < n; i++) {
          const pad = usable[Math.floor((i / n) * usable.length)]
          frogs.push({
            pad,
            x: pad.x + rand(-4, 4),
            y: pad.y - 4,
            size: rand(0.8, 1.25),
            croakT: rand(0.5, 4),
            throat: 0, // 0..1 bulge
            fear: 0,
            tremble: 0,
            hue: rand(80, 120),
          })
        }
      }

      function updateFrogs(dt) {
        for (const f of frogs) {
          const dx = f.x - snake.path[0].x
          const dy = f.y - snake.path[0].y
          const dist = Math.hypot(dx, dy)
          // Fear ramps up sharply when the snake is within ~220px.
          const target = clamp(1 - dist / 240, 0, 1)
          f.fear = lerp(f.fear, target, target > f.fear ? 0.2 : 0.04)
          f.tremble = f.fear

          f.croakT -= dt
          if (f.croakT <= 0) {
            // Frightened frogs croak faster and higher.
            f.croakT = lerp(rand(2.5, 5), rand(0.25, 0.7), f.fear)
            f.throat = 1
            croak(0.4 + f.fear * 0.6, 1 + f.fear * 0.9)
            spawnRipple(f.x, f.y + 6, 0.5 + f.fear * 0.5)
          }
          f.throat = Math.max(0, f.throat - dt * 2.6)
        }
      }

      function drawFrog(f) {
        const s = f.size
        const shake = f.tremble * Math.sin(performance.now() * 0.05 + f.x) * 2.4
        ctx.save()
        ctx.translate(f.x + shake, f.y)
        ctx.scale(s, s)

        const bodyDark = `hsl(${f.hue}, 30%, 8%)`
        const bodyLit = `hsl(${f.hue}, 38%, 15%)`

        // Hind legs.
        ctx.fillStyle = bodyDark
        ctx.beginPath(); ctx.ellipse(-9, 3, 5, 3, -0.5, 0, TAU); ctx.fill()
        ctx.beginPath(); ctx.ellipse(9, 3, 5, 3, 0.5, 0, TAU); ctx.fill()

        // Body.
        const bg = ctx.createLinearGradient(0, -10, 0, 8)
        bg.addColorStop(0, bodyLit)
        bg.addColorStop(1, bodyDark)
        ctx.fillStyle = bg
        ctx.beginPath(); ctx.ellipse(0, 0, 9, 7, 0, 0, TAU); ctx.fill()

        // Throat sac inflating with each croak.
        if (f.throat > 0.02) {
          ctx.fillStyle = `hsla(${f.hue + 10}, 45%, 22%, ${0.5 + f.throat * 0.4})`
          ctx.beginPath()
          ctx.ellipse(0, 5, 5 * f.throat + 1, 4 * f.throat + 1, 0, 0, TAU)
          ctx.fill()
        }

        // Head + bulging eyes.
        ctx.fillStyle = bodyLit
        ctx.beginPath(); ctx.ellipse(0, -5, 7, 5, 0, 0, TAU); ctx.fill()
        for (const ex of [-4.5, 4.5]) {
          ctx.fillStyle = bodyDark
          ctx.beginPath(); ctx.arc(ex, -8, 3.2, 0, TAU); ctx.fill()
          // Eye glints widen with fear.
          ctx.fillStyle = `rgba(200, 255, 180, ${0.5 + f.fear * 0.5})`
          ctx.beginPath(); ctx.arc(ex, -8, 1.6 + f.fear * 0.6, 0, TAU); ctx.fill()
          ctx.fillStyle = '#000'
          ctx.beginPath(); ctx.arc(ex, -8, 0.7, 0, TAU); ctx.fill()
        }
        ctx.restore()
      }

      // ----------------------------------------------------------------------
      // Fireflies / drifting spores.
      // ----------------------------------------------------------------------
      const flies = []
      function buildFlies() {
        flies.length = 0
        const n = Math.round(W / 26)
        for (let i = 0; i < n; i++) {
          flies.push({
            x: rand(0, W), y: rand(0, H),
            r: rand(0.5, 1.8),
            ph: rand(0, TAU),
            sp: rand(0.4, 1.4),
            drift: rand(4, 16),
            hue: rand(70, 140),
          })
        }
      }
      function updateFlies(dt) {
        for (const f of flies) {
          f.ph += dt * f.sp
          f.x += Math.sin(f.ph) * f.drift * dt
          f.y += Math.cos(f.ph * 0.7) * f.drift * 0.5 * dt
          if (f.x < -10) f.x = W + 10
          if (f.x > W + 10) f.x = -10
        }
      }
      function drawFlies() {
        ctx.save()
        ctx.globalCompositeOperation = 'lighter'
        for (const f of flies) {
          const a = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(f.ph * 2))) * 0.5
          ctx.fillStyle = `hsla(${f.hue}, 90%, 70%, ${a})`
          ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill()
        }
        ctx.restore()
      }

      // ----------------------------------------------------------------------
      // Background painting.
      // ----------------------------------------------------------------------
      let fogScroll = 0
      function drawBackground(dt) {
        fogScroll += dt * 8

        // Night sky with a sickly moon glow.
        const sky = ctx.createLinearGradient(0, 0, 0, waterY)
        sky.addColorStop(0, '#03070a')
        sky.addColorStop(0.6, '#06110d')
        sky.addColorStop(1, '#0a1812')
        ctx.fillStyle = sky
        ctx.fillRect(0, 0, W, waterY)

        // Moon.
        const mx = W * 0.74, my = waterY * 0.34
        const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 160)
        mg.addColorStop(0, 'rgba(180, 210, 180, 0.5)')
        mg.addColorStop(0.18, 'rgba(120, 160, 130, 0.22)')
        mg.addColorStop(1, 'rgba(80, 120, 100, 0)')
        ctx.fillStyle = mg
        ctx.fillRect(0, 0, W, waterY)
        ctx.fillStyle = 'rgba(200, 220, 195, 0.85)'
        ctx.beginPath(); ctx.arc(mx, my, 26, 0, TAU); ctx.fill()
        ctx.fillStyle = '#06110d'
        ctx.beginPath(); ctx.arc(mx + 12, my - 6, 24, 0, TAU); ctx.fill() // crescent

        // Tree layers, far to near.
        for (let li = treeLayers.length - 1; li >= 0; li--) {
          const layer = treeLayers[li]
          ctx.save()
          ctx.globalAlpha = layer.alpha
          ctx.strokeStyle = layer.shade
          ctx.lineCap = 'round'
          for (const tree of layer.trees) {
            for (const [x1, y1, x2, y2, depth] of tree.pts) {
              ctx.lineWidth = depth * 1.6
              ctx.beginPath()
              ctx.moveTo(x1, y1)
              ctx.lineTo(x2, y2)
              ctx.stroke()
            }
          }
          ctx.restore()
        }

        // Water.
        const wat = ctx.createLinearGradient(0, waterY, 0, H)
        wat.addColorStop(0, '#0a1712')
        wat.addColorStop(0.5, '#06100c')
        wat.addColorStop(1, '#020605')
        ctx.fillStyle = wat
        ctx.fillRect(0, waterY, W, H - waterY)

        // Moon reflection shimmering on the water.
        ctx.save()
        ctx.globalCompositeOperation = 'lighter'
        for (let i = 0; i < 18; i++) {
          const ry = waterY + 8 + i * ((H - waterY) / 18)
          const wob = Math.sin(fogScroll * 0.1 + i * 0.8) * 14
          const a = 0.05 * (1 - i / 18)
          ctx.fillStyle = `rgba(150, 190, 160, ${a})`
          ctx.fillRect(mx - 30 + wob, ry, 60, 2)
        }
        ctx.restore()

        // Bank reeds (drawn over the waterline).
        for (const rd of reeds) {
          rd.sway += dt
          const sway = Math.sin(rd.sway * 1.2 + rd.x) * 6
          ctx.strokeStyle = '#050b08'
          ctx.lineWidth = 2
          ctx.beginPath()
          ctx.moveTo(rd.x, rd.baseY)
          ctx.quadraticCurveTo(rd.x + sway * 0.5, rd.baseY - rd.h * 0.6, rd.x + sway, rd.baseY - rd.h)
          ctx.stroke()
          if (rd.head) {
            ctx.fillStyle = '#0a1009'
            ctx.beginPath()
            ctx.ellipse(rd.x + sway, rd.baseY - rd.h, 2.6, 7, 0, 0, TAU)
            ctx.fill()
          }
        }
      }

      function drawPads() {
        for (const p of pads) {
          ctx.save()
          ctx.translate(p.x, p.y)
          ctx.rotate(p.tilt)
          const g = ctx.createRadialGradient(0, 0, 2, 0, 0, p.r)
          g.addColorStop(0, '#12251a')
          g.addColorStop(1, '#081710')
          ctx.fillStyle = g
          ctx.beginPath()
          // Lily pad with a notch.
          ctx.ellipse(0, 0, p.r, p.r * 0.7, 0, 0.5, TAU + 0.2)
          ctx.lineTo(0, 0)
          ctx.fill()
          ctx.strokeStyle = 'rgba(40, 80, 55, 0.4)'
          ctx.lineWidth = 1
          for (let i = 0; i < 5; i++) {
            const a = -1 + i * 0.45
            ctx.beginPath(); ctx.moveTo(0, 0)
            ctx.lineTo(Math.cos(a) * p.r * 0.9, Math.sin(a) * p.r * 0.62)
            ctx.stroke()
          }
          ctx.restore()
        }
      }

      // Vignette + faint grain, drawn last.
      function drawAtmosphere() {
        const vg = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.3, W / 2, H * 0.5, H * 0.85)
        vg.addColorStop(0, 'rgba(0,0,0,0)')
        vg.addColorStop(1, 'rgba(0,0,0,0.65)')
        ctx.fillStyle = vg
        ctx.fillRect(0, 0, W, H)
      }

      // ----------------------------------------------------------------------
      // Audio — procedural "spooky swamp music": a low drone, a slow minor
      // motif on a soft pad, frog croaks, and evaporation hiss. All synthesized.
      // ----------------------------------------------------------------------
      let actx = null
      let master = null
      let started = false
      let musicTimer = 0
      let noiseBuf = null

      function initAudio() {
        if (actx) return
        const AC = window.AudioContext || window.webkitAudioContext
        if (!AC) return
        actx = new AC()
        master = actx.createGain()
        master.gain.value = 0.0
        master.connect(actx.destination)

        // Gentle master reverb-ish via a feedback delay for swampy space.
        const delay = actx.createDelay(1.0)
        delay.delayTime.value = 0.33
        const fb = actx.createGain()
        fb.gain.value = 0.32
        const wet = actx.createGain()
        wet.gain.value = 0.28
        delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master)
        master.delayIn = delay // expose send target

        // Low evolving drone (two detuned oscillators through a slow LP sweep).
        const droneGain = actx.createGain()
        droneGain.gain.value = 0.12
        const lp = actx.createBiquadFilter()
        lp.type = 'lowpass'
        lp.frequency.value = 220
        lp.Q.value = 6
        const lfo = actx.createOscillator()
        const lfoGain = actx.createGain()
        lfo.frequency.value = 0.06
        lfoGain.gain.value = 160
        lfo.connect(lfoGain); lfoGain.connect(lp.frequency)
        lfo.start()
        for (const f of [55, 55.4, 82.5]) {
          const o = actx.createOscillator()
          o.type = 'sawtooth'
          o.frequency.value = f
          o.connect(lp)
          o.start()
        }
        lp.connect(droneGain); droneGain.connect(master); droneGain.connect(delay)

        // Pre-render a noise buffer for croaks / hiss.
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 1.0, actx.sampleRate)
        const ch = noiseBuf.getChannelData(0)
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1

        // Fade in.
        master.gain.setTargetAtTime(0.6, actx.currentTime, 1.5)
      }

      // A soft bell/pad note for the spooky motif.
      function padNote(freq, when, dur, vel) {
        if (!actx) return
        const o = actx.createOscillator()
        const o2 = actx.createOscillator()
        o.type = 'triangle'
        o2.type = 'sine'
        o.frequency.value = freq
        o2.frequency.value = freq * 2.002
        const g = actx.createGain()
        g.gain.setValueAtTime(0, when)
        g.gain.linearRampToValueAtTime(vel, when + 0.04)
        g.gain.exponentialRampToValueAtTime(0.0005, when + dur)
        const f = actx.createBiquadFilter()
        f.type = 'lowpass'
        f.frequency.value = 1400
        o.connect(f); o2.connect(f); f.connect(g)
        g.connect(master); g.connect(master.delayIn)
        o.start(when); o2.start(when)
        o.stop(when + dur + 0.1); o2.stop(when + dur + 0.1)
      }

      // Phrygian-ish minor scale (spooky) around A.
      const SCALE = [220, 233.08, 261.63, 293.66, 329.63, 349.23, 392, 440]
      function scheduleMusic(dt) {
        if (!actx) return
        musicTimer -= dt
        if (musicTimer <= 0) {
          musicTimer = rand(2.4, 4.8)
          const now = actx.currentTime
          // A short falling motif, occasionally a low pedal note.
          const root = SCALE[Math.floor(rand(0, 3))]
          padNote(root, now, rand(2.2, 3.4), 0.10)
          if (Math.random() < 0.7) {
            const second = SCALE[Math.floor(rand(2, 5))]
            padNote(second, now + rand(0.4, 0.9), rand(1.6, 2.6), 0.07)
          }
          if (Math.random() < 0.4) padNote(root / 2, now, rand(3, 4), 0.08)
        }
      }

      function croak(intensity, pitch) {
        if (!actx || !started) return
        const now = actx.currentTime
        // Body of the croak: a pitched buzz with a fast vibrato (the "rrribbit").
        const o = actx.createOscillator()
        o.type = 'sawtooth'
        const base = 110 * pitch
        o.frequency.setValueAtTime(base, now)
        // Pulsing throat: square-ish amplitude modulation.
        const mod = actx.createOscillator()
        const modGain = actx.createGain()
        mod.type = 'square'
        mod.frequency.value = lerp(18, 34, intensity)
        modGain.gain.value = base * 0.4
        mod.connect(modGain); modGain.connect(o.frequency)
        const bp = actx.createBiquadFilter()
        bp.type = 'bandpass'
        bp.frequency.value = lerp(400, 800, intensity)
        bp.Q.value = 4
        const g = actx.createGain()
        const dur = lerp(0.32, 0.18, intensity)
        g.gain.setValueAtTime(0, now)
        g.gain.linearRampToValueAtTime(0.18 * intensity + 0.05, now + 0.03)
        g.gain.exponentialRampToValueAtTime(0.0005, now + dur)
        o.connect(bp); bp.connect(g); g.connect(master); g.connect(master.delayIn)
        o.start(now); mod.start(now)
        o.stop(now + dur + 0.05); mod.stop(now + dur + 0.05)
      }

      // Soft evaporation hiss from the snake's wake.
      function hiss() {
        if (!actx || !started || !noiseBuf) return
        const now = actx.currentTime
        const src = actx.createBufferSource()
        src.buffer = noiseBuf
        src.loop = true
        const hp = actx.createBiquadFilter()
        hp.type = 'highpass'
        hp.frequency.value = 4000
        const g = actx.createGain()
        g.gain.setValueAtTime(0, now)
        g.gain.linearRampToValueAtTime(0.02, now + 0.05)
        g.gain.exponentialRampToValueAtTime(0.0005, now + 0.5)
        src.connect(hp); hp.connect(g); g.connect(master)
        src.start(now); src.stop(now + 0.55)
      }

      // ----------------------------------------------------------------------
      // Main loop.
      // ----------------------------------------------------------------------
      let last = performance.now()
      function frame(now) {
        let dt = (now - last) / 1000
        last = now
        dt = Math.min(dt, 0.05) // clamp after tab-out

        // Update.
        updateSnake(dt)
        updateSteam(dt)
        updateRipples(dt)
        updateFrogs(dt)
        updateFlies(dt)
        if (started) scheduleMusic(dt)

        // Snake leaves a wake ripple now and then.
        if (Math.random() < dt * 6) spawnRipple(snake.path[0].x, snake.path[0].y, 0.6)

        // Render.
        ctx.clearRect(0, 0, W, H)
        drawBackground(dt)
        drawPads()
        drawRipples()
        drawSnake()
        // Frogs sorted so nearer (lower) ones draw on top.
        for (const f of frogs) drawFrog(f)
        drawSteam()
        drawFlies()
        drawAtmosphere()

        requestAnimationFrame(frame)
      }

      // ----------------------------------------------------------------------
      // Interaction + boot.
      // ----------------------------------------------------------------------
      const veil = document.getElementById('veil')
      function wake() {
        if (started) return
        started = true
        initAudio()
        if (actx && actx.state === 'suspended') actx.resume()
        veil.classList.add('gone')
      }
      veil.addEventListener('click', wake)
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ') wake()
      })

      canvas.addEventListener('pointerdown', (e) => {
        const x = e.clientX, y = e.clientY
        if (y > waterY) {
          spawnRipple(x, y, 1.4)
          for (let i = 0; i < 5; i++) spawnSteam(x + rand(-10, 10), y + rand(-6, 6))
        }
        if (!started) wake()
      })

      window.addEventListener('resize', () => {
        resize()
        resetSnake()
        buildFrogs()
        buildFlies()
      })

      // Boot. Start the snake already mid-swim so the first frame (and the
      // gallery screenshot) shows it slithering rather than an empty bank.
      resize()
      resetSnake(W * 0.34)
      buildFrogs()
      buildFlies()
      requestAnimationFrame(frame)
    </script>
  </body>
</html>
