<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lotus OS — a toy desktop on a real desk</title>
    <meta
      name="description"
      content="A black-and-purple toy desktop with Thai temple ornament, resizable windows and folders — run reveal.run and the camera pulls back to find the monitor on a cluttered workbench."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0713'/><g fill='none' stroke='%23d3ab55' stroke-width='1.6' stroke-linejoin='round'><path d='M16 7c2.6 2.7 2.6 6.6 0 9.3-2.6-2.7-2.6-6.6 0-9.3z'/><path d='M16 16.3c-3.4 1-6.8-.6-8.2-3.8 3.4-1 6.8.6 8.2 3.8z'/><path d='M16 16.3c3.4 1 6.8-.6 8.2-3.8-3.4-1-6.8.6-8.2 3.8z'/><path d='M16 17c-3.7 0-6.8 2.4-7.7 5.7 3.7.9 7.4-.9 8.9-4.3'/><path d='M16 17c3.7 0 6.8 2.4 7.7 5.7-3.7.9-7.4-.9-8.9-4.3'/><path d='M6.6 24.4h18.8'/></g></svg>" />
    <link rel="stylesheet" href="./src/style/index.css" />
  </head>
  <body>
    <!-- Behind the panel, and normally invisible because the panel covers the
         window. It shows as a letterbox only in a window too small to hold the
         machine at 1:1, and it is what the room fades up out of. -->
    <div id="void" aria-hidden="true"></div>

    <!-- The panel is the window, down to a floor. Under that it holds its
         minimum and the whole layer is scaled down, which on a phone leaves it
         small — say so rather than leaving somebody squinting at it wondering
         what went wrong. -->
    <p id="narrow">This machine wants a bigger window.</p>

    <!-- Holds the screen in the page. Normally the scale here is exactly 1 and
         this element is the size of the window; it only does any scaling below
         the floor. The scale lives HERE and never on #os, because once #os is
         handed to the CSS3D renderer that element's transform belongs to
         three.js. -->
    <div id="stage-wrap">
      <!-- #os is the whole machine: a logical screen the size and shape of the
           window. It is moved, intact and still running, into the 3D monitor
           and back. -->
      <div id="os" class="os">
        <header id="appbar" class="appbar"></header>
        <main id="desktop" class="desktop"></main>
        <div id="layer-windows" class="layer layer--windows"></div>
        <div id="layer-snap" class="layer layer--snap" aria-hidden="true"></div>
        <div id="layer-menus" class="layer layer--menus"></div>
        <div id="layer-modals" class="layer layer--modals"></div>
        <!-- Glass, scanlines and glare. Only switched on once #os is actually
             sitting inside a monitor. -->
        <div id="glass" class="glass" aria-hidden="true"></div>
        <!-- The monitor's own OSD. Only ever raised while #os is inside the
             monitor and the signal it is being fed changes shape. -->
        <div id="osd" class="osd" aria-hidden="true"></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
