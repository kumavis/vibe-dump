<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A pop-up book of the eight jhānas." />
    <title>Jhāna Book</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <p id="hint">click the book</p>
      <p id="tabhint" aria-hidden="true">pull the tab</p>
      <button id="arrow-prev" class="arrow none" type="button" aria-label="Previous page">‹</button>
      <button id="arrow-next" class="arrow" type="button" aria-label="Next page">›</button>
      <button id="again" type="button">begin again</button>
      <nav id="dots" aria-label="Spreads"></nav>
      <div id="breath" aria-hidden="true"><span></span></div>
      <button id="guide" type="button" aria-label="Guide" aria-pressed="true" title="Guide on">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path class="flame" d="M12 4.2c1.7 2 2.5 3.5 2.5 4.8a2.5 2.5 0 0 1-5 0c0-1.3.8-2.8 2.5-4.8z" />
          <path class="dish" d="M4.5 14.2h15c-.7 2.5-3.6 4.3-7.5 4.3s-6.8-1.8-7.5-4.3z" />
          <path class="glow" d="M6.2 9.6l-1.4-.8M17.8 9.6l1.4-.8M12 1.6v.9" />
        </svg>
      </button>
      <button id="sound" type="button" aria-label="Sound" aria-pressed="false" title="Sound off">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke="none" />
          <path class="wave" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4" />
          <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" />
        </svg>
      </button>
    </div>
    <p id="live" class="sr-only" aria-live="polite"></p>

    <script type="module" src="./main.js"></script>
  </body>
</html>
