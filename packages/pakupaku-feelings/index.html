<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pakupaku Feelings</title>
<meta name="description" content="A paper fortune teller for feelings: unfold a simple feeling into closer words, then into the needs underneath it, Nonviolent Communication style.">
<meta name="theme-color" content="#f4ecdd">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f4ecdd'/><path d='M16 16 4 4h12Z' fill='%23f5953a'/><path d='M16 16 16 4h12Z' fill='%23f7c641'/><path d='M16 16 28 4v12Z' fill='%23ee7aa0'/><path d='M16 16h12v12Z' fill='%235cbb78'/><path d='M16 16 28 28H16Z' fill='%2345a7b3'/><path d='M16 16v12H4Z' fill='%234e89d6'/><path d='M16 16 4 28V16Z' fill='%239a6dcb'/><path d='M16 16H4V4Z' fill='%23e4574b'/></svg>">
</head>
<body>
<svg id="garden" aria-hidden="true"></svg>

<main id="app">
  <svg id="stage" viewBox="-494 -494 988 988" preserveAspectRatio="xMidYMid meet" role="group">
    <defs>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5"/>
      </filter>
      <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="3" dy="6" stdDeviation="7" flood-color="#5a3a1c" flood-opacity="0.22"/>
      </filter>
      <pattern id="grain" patternUnits="userSpaceOnUse" width="160" height="160">
        <image width="160" height="160"/>
      </pattern>
    </defs>
    <g id="under"></g>
    <g id="sheet"></g>
  </svg>

  <nav id="choices" class="choices"></nav>

  <div id="lang" class="lang">
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="ja" lang="ja">日本語</button>
  </div>

  <button id="nvc-link" class="nvc-link" type="button" hidden></button>
</main>

<dialog id="fortune" class="sheet"></dialog>
<dialog id="about" class="sheet"></dialog>

<script type="module" src="./src/main.js"></script>
</body>
</html>
