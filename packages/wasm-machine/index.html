<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Wasm Machine: an interactive WebAssembly runtime that shows the operand stack, labels, frames, memory and bytes as each instruction executes. A guided tutorial and a debugger for any .wasm or WAT." />
    <title>Wasm Machine</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='14.5' width='16' height='5' rx='1.4' fill='%235bb5ea'/%3E%3Crect x='4' y='8.5' width='16' height='5' rx='1.4' fill='%2340c290'/%3E%3Crect x='7' y='2.5' width='10' height='5' rx='1.4' fill='%238e96ff'/%3E%3C/svg%3E" />
    <script>
      // apply the saved theme before first paint (no flash)
      try {
        var p = JSON.parse(localStorage.getItem('wasm-machine:prefs') || '{}')
        var t = p.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = t
        var a = p.anim != null ? p.anim : !matchMedia('(prefers-reduced-motion: reduce)').matches
        document.documentElement.dataset.anim = a ? 'on' : 'off'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Wasm Machine needs JavaScript: it is a WebAssembly interpreter written in JavaScript.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
