name: CI build check

# Verify the whole monorepo builds (apps + screenshot gallery) on every PR,
# so a branch can't merge into main unless `npm run build` succeeds. This job
# only builds — it never deploys (that's deploy.yml's job on push to main).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Thumbnails are captured by hand (`npm run thumbnails`) and committed,
          # so CI never launches a browser. Playwright has no postinstall hook at
          # the pinned version; this makes sure a future bump can't quietly put a
          # browser download back into the build.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build apps + gallery
        run: npm run build

      # A new app whose thumbnail was never captured would silently ship a text
      # placeholder card, so fail the PR instead of the gallery.
      - name: Check every app has a committed thumbnail
        run: npm run thumbnails -- --check
