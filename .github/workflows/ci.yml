name: CI check

# Apps and thumbnails are built locally and committed. CI validates those
# assets and generates only the lightweight gallery shell and JSON app list.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Recency uses commit/tree history, not old asset contents.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # All commands below use Node builtins only. No npm install or browser.
      - name: Test gallery data and local assembly
        run: npm run test:gallery

      - name: Verify committed app assets
        run: npm run verify

      - name: Generate deployment gallery
        run: npm run build:gallery -- --require-history

      - name: Ensure generation leaves tracked files unchanged
        run: git diff --exit-code
