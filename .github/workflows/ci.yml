name: CI check

# Check that the committed dist/ still matches the packages, on every PR.
#
# This job deliberately builds nothing. The apps are built by hand and dist/ is
# committed with the PR (see "Adding a vibe" in README.md), so CI's only job is
# to catch a PR that changed an app and forgot to rebuild. Building all of them
# here would get slower with every vibe added; this stays flat.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm install: scripts/verify.mjs is node builtins only.
      - name: Verify dist/ is in step with packages/
        run: npm run verify
