name: CI build check

# Verify the whole monorepo builds (apps + screenshot gallery) on every PR,
# so a branch can't merge into main unless `npm run build` succeeds. This job
# only builds — it never deploys (that's deploy.yml's job on push to main).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build apps + gallery
        run: npm run build
