name: Deploy gallery to GitHub Pages

# App builds and thumbnails are already committed. Deployment only copies the
# stable gallery shell and writes apps.json from per-app metadata. No dependency
# installation, app compilation, screenshot generation, or browser launch.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Dates need history; historical app binaries are not fetched.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify committed app assets
        run: npm run verify

      - name: Generate gallery from committed metadata and assets
        run: npm run build:gallery -- --require-history

      - name: Upload the finished gallery
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
