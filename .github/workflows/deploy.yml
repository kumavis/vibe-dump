name: Deploy gallery to GitHub Pages

# Publishes the committed dist/ as-is. Nothing is built here — no Node, no npm,
# no browser. `npm run build` runs on a contributor's machine and dist/ goes in
# with the PR, so a deploy is a file copy whose cost doesn't grow with the
# number of vibes.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload the committed gallery
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
