<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Snake Swamp</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #04060a; overflow: hidden; }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }

      /* "Tap to wake the swamp" overlay — Web Audio needs a user gesture. */
      #veil {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: radial-gradient(120% 90% at 50% 40%, rgba(8, 18, 14, 0.18), rgba(2, 4, 6, 0.6));
        color: #9fb8a6;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        text-align: center;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: opacity 1.1s ease;
        z-index: 10;
      }
      #veil h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 3.2rem);
        font-weight: 600;
        color: #c8dcc8;
        text-shadow: 0 0 24px rgba(40, 90, 60, 0.6);
      }
      #veil p { margin: 0; font-size: 0.95rem; opacity: 0.75; }
      #veil .pulse {
        margin-top: 0.4rem;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.32em;
        opacity: 0.6;
        animation: breathe 2.6s ease-in-out infinite;
      }
      @keyframes breathe { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } }
      #veil.gone { opacity: 0; pointer-events: none; }

      #hint {
        position: fixed;
        left: 50%;
        bottom: 1rem;
        transform: translateX(-50%);
        font-family: "Iowan Old Style", Georgia, serif;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        color: rgba(150, 180, 160, 0.5);
        pointer-events: none;
        z-index: 5;
        text-transform: uppercase;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BIzd8zJE.js"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hint">click the water · the snake drinks the swamp dry</div>
    <div id="veil">
      <h1>Black Snake Swamp</h1>
      <p>a dark forest, a thirsty serpent, frogs that have learned to be afraid</p>
      <span class="pulse">tap to wake the swamp</span>
    </div>

  </body>
</html>
